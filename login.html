<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Jolly Rogers</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="topo">
  <img src="img/logo-completo.png" alt="Jolly Rogers">
</header>

<main>
  <section class="cartao" aria-labelledby="t-login">
    <h1 id="t-login">Entrar no sistema</h1>
    <form id="form-login" autocomplete="on">
      <p>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </p>
      <p>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </p>
      <p id="msg" class="msg" role="alert" hidden></p>
      <button type="submit">ENTRAR</button>
    </form>
    <p class="rodape-login"><a href="privacidade.html">Política de Privacidade</a></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
